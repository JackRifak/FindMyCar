<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <title>Find My Car | Live Navigation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/parking-ui/favicon.svg" />
    <link rel="stylesheet" href="/parking-ui/styles.css?v=20261004-nocal" />
  </head>
  <body>
    <div class="ar-stage" id="arStage">
      <video id="cameraView" playsinline muted autoplay></video>
      <img id="arPreview" alt="" />
      <canvas id="arCanvas"></canvas>

      <div class="ar-top">
        <div class="brand-chip">
          <span class="mark">F</span>
          <span>Find My Car</span>
        </div>
        <div id="statusChip" class="status-chip is-warn">Ready</div>
      </div>

      <div id="arriveOverlay" class="arrive-overlay" hidden>
        <div class="arrive-rings" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <div class="arrive-card">
          <div class="arrive-check" aria-hidden="true">
            <svg viewBox="0 0 48 48">
              <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="2.5" />
              <path d="M14 25 L21 32 L34 16" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
          <p class="arrive-kicker">Destination</p>
          <h2 class="arrive-title">You have reached</h2>
          <p class="arrive-slot" id="arriveSlot">—</p>
          <button id="arriveDismissBtn" type="button" class="primary-btn arrive-dismiss">Done</button>
        </div>
      </div>

      <div id="turnBanner" class="turn-banner" hidden>
        <div class="turn-arrow-wrap" aria-hidden="true">
          <svg id="turnIcon" class="turn-icon" viewBox="0 0 24 24">
            <path d="M12 3 L12 17 M12 3 L7 8 M12 3 L17 8" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <div class="turn-copy">
          <p id="turnLabel" class="turn-label">Continue straight</p>
          <p id="turnDistance" class="turn-distance">—</p>
        </div>
        <div class="turn-dest">
          Slot
          <strong id="hudSlot">—</strong>
        </div>
      </div>

      <p id="arHint" class="ar-hint">Choose your parking slot to begin</p>

      <div class="ar-bottom">
        <div class="telemetry">
          <div>
            <span>Floor</span>
            <strong id="metricFloor">—</strong>
          </div>
          <div>
            <span>Position</span>
            <strong id="metricCoords">—</strong>
          </div>
          <div>
            <span>Heading</span>
            <strong id="metricHeading">—</strong>
          </div>
          <div>
            <span>Left</span>
            <strong id="metricDistance">—</strong>
          </div>
        </div>

        <div class="action-row">
          <button id="slotSheetBtn" type="button" class="ghost-btn">Slot</button>
          <button id="localizeBtn" type="button" class="secondary-btn" disabled>Localize</button>
          <button id="routeBtn" type="button" class="primary-btn" disabled>Start nav</button>
        </div>
        <p id="statusLine" class="status-line" role="status">Select a parking slot, then localize.</p>
      </div>
    </div>

    <!-- slot picker -->
    <div id="slotSheet" class="sheet">
      <div class="sheet-backdrop" data-close-sheet="slot"></div>
      <div class="sheet-panel">
        <div class="sheet-handle"></div>
        <h2>Where did you park?</h2>
        <p class="sheet-sub">Pick your bay, then lock your position with the camera.</p>
        <label class="field-label" for="slotInput">Slot ID</label>
        <input id="slotInput" list="slotSuggestions" placeholder="e.g. 87-04C" autocomplete="off" />
        <datalist id="slotSuggestions"></datalist>
        <div id="slotSuggestionsMini" class="chip-list"></div>
        <button id="destinationContinueBtn" type="button" class="primary-btn sheet-confirm" disabled>Continue</button>
      </div>
    </div>

    <!-- calibration UI temporarily disabled
    <div id="calSheet" class="sheet" hidden>
      <div class="sheet-backdrop" data-close-sheet="cal"></div>
      <div class="sheet-panel cal-panel">
        <div class="sheet-handle"></div>
        <h2>Phone calibration</h2>
        <p class="sheet-sub">Run each step once. This tunes heading and stride for live navigation.</p>

        <div class="calibration-steps" id="calibrationSteps">
          <article class="cal-step is-active" data-step="stillness">
            <span class="step-number">1</span>
            <div class="cal-step-copy">
              <h4>Stillness</h4>
              <p>Hold still for a few seconds.</p>
            </div>
            <button type="button" class="step-action" data-step-key="stillness">Start</button>
          </article>
          <article class="cal-step" data-step="magnetometer">
            <span class="step-number">2</span>
            <div class="cal-step-copy">
              <h4>Compass</h4>
              <p>Slow figure-8 rotation.</p>
            </div>
            <button type="button" class="step-action" data-step-key="compass">Start</button>
          </article>
          <article class="cal-step" data-step="walk">
            <span class="step-number">3</span>
            <div class="cal-step-copy">
              <h4>Walk</h4>
              <p>Take ~5 steps forward.</p>
            </div>
            <button type="button" class="step-action" data-step-key="walk">Start</button>
          </article>
        </div>

        <div class="calibration-visual step-stillness" id="calibrationVisual" hidden aria-hidden="true"></div>
        <div id="calibrationStatus" class="cal-status">Waiting for calibration to begin.</div>
        <p id="calibrationHint" class="cal-hint">Hold the phone still to stabilize sensors.</p>

        <div class="sheet-actions">
          <button id="calibrationBackBtn" type="button" class="secondary-btn">Back</button>
          <button id="calibrationContinueBtn" type="button" class="primary-btn" disabled>Open camera</button>
        </div>
      </div>
    </div>
    -->
    <!-- stubs so app.js getElementById calls stay safe while calibration is off -->
    <div id="calSheet" hidden aria-hidden="true"></div>
    <button id="calibrationBackBtn" type="button" hidden aria-hidden="true"></button>
    <button id="calibrationContinueBtn" type="button" hidden aria-hidden="true"></button>
    <div id="calibrationStatus" hidden aria-hidden="true"></div>
    <p id="calibrationHint" hidden aria-hidden="true"></p>
    <div id="calibrationVisual" hidden aria-hidden="true"></div>

    <!-- hidden diagnostics defaults (kept for captureVprPosition) -->
    <div class="sr-only" aria-hidden="true">
      <input id="groundTruthLocationId" list="diagnosticLocations" value="" />
      <datalist id="diagnosticLocations"></datalist>
      <select id="captureTriggerMode"><option value="motion" selected>motion</option></select>
      <select id="captureMaxDimension"><option value="1280" selected>1280</option></select>
      <select id="captureJpegQuality"><option value="0.8" selected>0.8</option></select>
      <input id="blurGuardEnabled" type="checkbox" />
      <span id="sessionState"></span>
      <span id="positionState"></span>
      <span id="confidenceState"></span>
      <span id="localizationStatus"></span>
      <span id="selectedSlotSummary"></span>
      <span id="routeBadge"></span>
      <span id="routeDestination"></span>
      <span id="routeDistance"></span>
      <span id="routeTotalDistance"></span>
      <span id="routeStatus"></span>
      <ol id="turnInstructions"></ol>
      <svg id="routeSvg"></svg>
      <button id="navigationBackBtn" type="button"></button>
    </div>

    <script src="/ar-vio.js"></script>
    <script src="/parking-ui/app.js?v=20261004-fastdist"></script>
  </body>
</html>
