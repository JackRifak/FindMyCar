<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Find My Car - 3D Mapper</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 0; background: #111; color: white; }
        .video-container { position: relative; width: 100vw; height: 60vh; background: #000; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { display: none; }
        #features-canvas { display: block !important; position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        .controls { padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .row { display: flex; gap: 10px; }
        button { flex: 1; padding: 15px; border-radius: 8px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; }
        .primary { background: #007aff; color: white; }
        .danger { background: #ff3b30; color: white; }
        .success { background: #34c759; color: white; }
        
        /* Modal for Floorplan picker */
        #map-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; }
        #map-container { flex: 1; overflow: auto; position: relative; }
        #floorplan-canvas { cursor: crosshair; display: block; }
        #map-marker { position: absolute; width: 12px; height: 12px; background: red; border-radius: 50%; transform: translate(-50%, -50%); display: none; pointer-events: none; border: 2px solid white; }
        .modal-controls { padding: 15px; background: #222; display: flex; gap: 10px; flex-shrink: 0; padding-bottom: max(15px, env(safe-area-inset-bottom)); }
        
        /* Modal for 3D Viewer */
        #viewer-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 200; flex-direction: column; }
        #viewer-container { flex: 1; overflow: hidden; position: relative; }
        
        /* Telemetry HUD & Badges */
        .hud-overlay { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; z-index: 10; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; width: fit-content; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-success { background: #34c759; color: black; }
        .badge-warning { background: #ff9500; color: black; }
        .badge-info { background: #007aff; color: white; }
        .hud-telemetry { background: rgba(0, 0, 0, 0.75); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; padding: 8px 10px; font-family: monospace; font-size: 11px; line-height: 1.4; color: #34c759; text-shadow: 0 0 2px rgba(52, 199, 89, 0.5); backdrop-filter: blur(4px); }
        
        /* Server config bar */
        .config-bar { padding: 8px 15px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; display: flex; gap: 8px; align-items: center; font-size: 12px; }
        .config-bar input { flex: 1; background: #2a2a2a; border: 1px solid #444; color: white; padding: 6px 8px; border-radius: 4px; font-size: 12px; }
        .config-bar button { padding: 6px 12px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; background: #444; color: white; }
        
        #status { font-family: monospace; font-size: 12px; color: #aaa; margin-top: 10px; word-break: break-all; }
    </style>
</head>
<body>
    <div class="config-bar">
        <label for="server-url">Server:</label>
        <input type="text" id="server-url" placeholder="Backend URL (leave empty for current host)">
        <button id="btn-save-server">Set</button>
    </div>

    <div class="video-container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="features-canvas"></canvas>
        <canvas id="canvas"></canvas>
        <div class="hud-overlay">
            <div style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center;">
                <div id="tracking-badge" class="badge badge-warning">WebXR: Initializing...</div>
                <div id="features-badge" class="badge badge-info" style="display: none; background: rgba(0, 220, 255, 0.9); color: black;">Features: 0</div>
            </div>
            <div id="pose-hud" class="hud-telemetry" style="display: none;">
                <div><strong>AR Pose (6-DOF):</strong></div>
                <div id="hud-pos">X: 0.000m | Y: 0.000m | Z: 0.000m</div>
                <div id="hud-rot" style="color: #888;">Q: [0, 0, 0, 1]</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="row">
            <button id="btn-start" class="primary">Start AR Mapping</button>
            <button id="btn-stop" class="danger" style="display:none;">Pause Mapping</button>
        </div>
        
        <div class="row">
            <button id="btn-show-tag" class="primary" style="display:none;">Drop Tag</button>
            <button id="btn-finalize" class="success" style="display:none;">Finalize 3D Map</button>
        </div>
        <div class="row">
            <button id="btn-new-walk" style="display:none; background:#333; color:#ff9500; border:1px solid #ff9500;">New Session</button>
            <button id="btn-clear-map" style="display:none; background:#333; color:#ff3b30; border:1px solid #ff3b30;">Clear Map</button>
        </div>
        <div class="row">
            <button id="btn-view-3d" class="primary">View 3D Point Cloud</button>
            <button id="btn-toggle-features" style="background: #222; color: #34c759; border: 1px solid #34c759;">Features: ON</button>
        </div>
        
        <div id="status">Ready. Tap 'Start Mapping' to begin.</div>
        
        <!-- Live Debug Log Panel for Mobile Diagnostic Visibility -->
        <div style="margin-top: 8px; background: #18191c; border: 1px solid #2e3035; border-radius: 6px; padding: 10px; font-family: monospace; font-size: 11px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; color: #888;">
                <span style="font-weight: bold; color: #34c759;">LIVE DEBUG LOG:</span>
                <button id="btn-clear-log" style="flex: none; padding: 3px 8px; font-size: 10px; background: #333; color: #bbb; border-radius: 4px; border: none; cursor: pointer;">Clear</button>
            </div>
            <div id="debug-log-entries" style="max-height: 120px; overflow-y: auto; display: flex; flex-direction: column-reverse; gap: 3px; color: #ccc;">
                <div style="color: #666;">System ready.</div>
            </div>
        </div>
    </div>

    <!-- Map Picker Modal -->
    <div id="map-modal">
        <div id="map-container">
            <canvas id="floorplan-canvas"></canvas>
            <div id="map-marker"></div>
        </div>
        <div class="modal-controls">
            <button id="btn-cancel-tag" class="danger">Cancel</button>
            <button id="btn-submit-tag" class="success" disabled>Confirm Location</button>
        </div>
    </div>

    <!-- 3D Viewer Modal -->
    <div id="viewer-modal">
        <div style="position: absolute; top: 15px; left: 15px; right: 15px; z-index: 210; display: flex; justify-content: space-between; align-items: center; pointer-events: none;">
            <div id="viewer-stats" style="background: rgba(0,0,0,0.8); padding: 8px 12px; border-radius: 6px; font-family: monospace; font-size: 12px; color: #34c759; border: 1px solid rgba(255,255,255,0.2);">Loading 3D Point Cloud...</div>
            <div style="display:flex; gap:8px; pointer-events:auto;">
                <button id="btn-toggle-3d-landmarks" style="padding: 7px 14px; font-size: 12px; font-weight: bold; background: #ff9500; color: #000; border: none; border-radius: 6px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.5);">📍 Landmarks: ON</button>
            </div>
        </div>
        <div id="viewer-container"></div>
        <div class="modal-controls">
            <button id="btn-close-viewer" class="danger">Close 3D View</button>
        </div>
    </div>

    <!-- Three.js Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/PLYLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Cache-buster to ensure the latest JS is loaded on mobile -->
    <script>
        const script = document.createElement('script');
        script.src = '/mapping.js?v=' + Date.now();
        document.body.appendChild(script);
    </script>
</body>
</html>
